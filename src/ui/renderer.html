<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Declarative vrev">
  <title>Vrev</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/renderer.css">
</head>
<body>
  <main id="renderer-root" aria-busy="true">
    <div class="vr-app-shell vr-loading-shell" role="status" aria-label="画面を読み込み中">
      <header class="vr-header vr-base-header" aria-hidden="true">
        <div class="vr-brand-copy vr-loading-brand">
          <span class="vr-loading-block vr-loading-eyebrow"></span>
          <span class="vr-loading-block vr-loading-title"></span>
        </div>
        <div class="vr-header-actions vr-loading-actions">
          <span class="vr-loading-block"></span>
          <span class="vr-loading-block"></span>
        </div>
        <span class="vr-settings-link vr-loading-settings vr-loading-block"></span>
      </header>
      <div class="vr-split-panel" aria-hidden="true">
        <section class="vr-section vr-stage-host vr-loading-stage">
          <div class="vr-loading-stage-frame">
            <span class="vr-loading-block vr-loading-stage-toolbar"></span>
            <span class="vr-loading-block vr-loading-stage-content"></span>
          </div>
        </section>
        <aside class="vr-slot vr-sidebar-host vr-loading-sidebar">
          <span class="vr-loading-block vr-loading-sidebar-title"></span>
          <div class="vr-loading-sidebar-card">
            <span class="vr-loading-block"></span>
            <span class="vr-loading-block"></span>
            <span class="vr-loading-block"></span>
          </div>
          <div class="vr-loading-sidebar-card">
            <span class="vr-loading-block"></span>
            <span class="vr-loading-block"></span>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script type="module" src="/renderer.js"></script>
</body>
</html>
