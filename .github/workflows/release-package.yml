name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to recover or republish missing packages
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nakak10'

      - name: Apply release tag version to every package
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.1.9: $RELEASE_TAG" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          npm version "$release_version" --no-git-tag-version --ignore-scripts --allow-same-version
          RELEASE_VERSION="$release_version" node <<'NODE'
          const fs = require("node:fs");
          const files = [
            "plugins/review/package.json",
            "plugins/review/visual-review.plugin.json",
            "plugins/github-issue/package.json",
            "plugins/github-issue/visual-review.plugin.json",
            "plugins/custom-command/package.json",
            "plugins/custom-command/visual-review.plugin.json",
            "plugins/annotation-workflow/package.json",
            "plugins/annotation-workflow/visual-review.plugin.json",
            "plugins/firebase-storage/package.json",
            "plugins/firebase-storage/visual-review.plugin.json",
          ];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }
          NODE

      - name: Validate synchronized release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          RELEASE_VERSION="$expected_version" node <<'NODE'
          const fs = require("node:fs");
          const files = [
            "package.json",
            "package-lock.json",
            "plugins/review/package.json",
            "plugins/review/visual-review.plugin.json",
            "plugins/github-issue/package.json",
            "plugins/github-issue/visual-review.plugin.json",
            "plugins/custom-command/package.json",
            "plugins/custom-command/visual-review.plugin.json",
            "plugins/annotation-workflow/package.json",
            "plugins/annotation-workflow/visual-review.plugin.json",
            "plugins/firebase-storage/package.json",
            "plugins/firebase-storage/visual-review.plugin.json",
          ];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            if (data.version !== process.env.RELEASE_VERSION) {
              throw new Error(`${file} has version ${data.version}; expected ${process.env.RELEASE_VERSION}`);
            }
          }
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.packages?.[""]?.version !== process.env.RELEASE_VERSION) {
            throw new Error(`package-lock root has version ${lock.packages?.[""]?.version}; expected ${process.env.RELEASE_VERSION}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Select npm dist-tag
        id: dist-tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Publish package when its version is new
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Skipping existing ${name}@${version}"
          else
            npm publish --tag "${{ steps.dist-tag.outputs.value }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugin packages when their version is new
        run: |
          for directory in plugins/review plugins/github-issue plugins/custom-command plugins/annotation-workflow plugins/firebase-storage; do
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Skipping existing ${name}@${version}"
            else
              npm publish "./${directory}" --tag latest
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
