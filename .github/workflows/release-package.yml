name: Publish packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to recover or republish missing packages
        required: true
        type: string
      bootstrap:
        description: Use NPM_TOKEN for first-time package publishing
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      # Recover old tags using the supported minimum runtime they were tested on.
      - name: Set up Node.js for build and tests
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Apply release version and repository metadata to every package
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.3.0: $RELEASE_TAG" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          npm version "$release_version" --no-git-tag-version --ignore-scripts --allow-same-version
          RELEASE_VERSION="$release_version" node <<'NODE'
          const fs = require("node:fs");
          const files = [
            "packages/plugin-sdk/package.json",
            "plugins/review/package.json",
            "plugins/review/vrev.plugin.json",
            "plugins/ai/package.json",
            "plugins/ai/vrev.plugin.json",
            "plugins/annotation-workflow/package.json",
            "plugins/annotation-workflow/vrev.plugin.json",
            "plugins/github-issue/package.json",
            "plugins/github-issue/vrev.plugin.json",
            "plugins/firestore/package.json",
            "plugins/firestore/vrev.plugin.json",
            "plugins/page-map/package.json",
            "plugins/page-map/vrev.plugin.json",
          ];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = process.env.RELEASE_VERSION;
            // Old tags can be recovered without moving their source references.
            if (file.endsWith("/package.json")) {
              data.repository = {
                type: "git",
                url: "git+https://github.com/NAKAK10/vrev.git",
                directory: file.slice(0, -"/package.json".length),
              };
            }
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }
          NODE

      - name: Validate synchronized release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          RELEASE_VERSION="$expected_version" node <<'NODE'
          const fs = require("node:fs");
          const files = [
            "package.json",
            "package-lock.json",
            "packages/plugin-sdk/package.json",
            "plugins/review/package.json",
            "plugins/review/vrev.plugin.json",
            "plugins/ai/package.json",
            "plugins/ai/vrev.plugin.json",
            "plugins/annotation-workflow/package.json",
            "plugins/annotation-workflow/vrev.plugin.json",
            "plugins/github-issue/package.json",
            "plugins/github-issue/vrev.plugin.json",
            "plugins/firestore/package.json",
            "plugins/firestore/vrev.plugin.json",
            "plugins/page-map/package.json",
            "plugins/page-map/vrev.plugin.json",
          ];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            if (data.version !== process.env.RELEASE_VERSION) {
              throw new Error(`${file} has version ${data.version}; expected ${process.env.RELEASE_VERSION}`);
            }
          }
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.packages?.[""]?.version !== process.env.RELEASE_VERSION) {
            throw new Error(`package-lock root has version ${lock.packages?.[""]?.version}; expected ${process.env.RELEASE_VERSION}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Select npm dist-tag
        id: dist-tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Inspect every npm package
        run: |
          npm pack --dry-run
          npm pack --dry-run ./packages/plugin-sdk
          for directory in dist/plugins/review dist/plugins/ai dist/plugins/firestore dist/plugins/annotation-workflow dist/plugins/page-map dist/plugins/github-issue; do
            npm pack --dry-run "./${directory}"
          done

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # No registry-url: avoid placeholder credentials masking OIDC failures.
      # npm exchanges GitHub OIDC before checking configured registry credentials.
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Configure first-publish authentication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::Bootstrap requires the repository secret NPM_TOKEN with publish access to every package."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm whoami --registry https://registry.npmjs.org
          echo "Using bootstrap credentials. Configure trusted publishing and remove NPM_TOKEN afterward."

      - name: Publish missing package versions to npm
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
        run: |
          publish_if_missing() {
            directory="$1"
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            # Query the public version endpoint directly. Never treat npm CLI/auth
            # or network errors as evidence that an immutable version is missing.
            publication_state="$(PACKAGE_NAME="$name" PACKAGE_VERSION="$version" node --input-type=module <<'NODE'
          const name = process.env.PACKAGE_NAME;
          const version = process.env.PACKAGE_VERSION;
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, { headers: { "cache-control": "no-cache" }, signal: AbortSignal.timeout(30_000) });
          if (response.status === 404) {
            console.log("missing");
          } else {
            if (!response.ok) throw new Error(`Registry version lookup failed: HTTP ${response.status}`);
            const metadata = await response.json();
            if (metadata.name !== name || metadata.version !== version) throw new Error("Registry returned unexpected package metadata");
            console.log("present");
          }
          NODE
            )" || return 1
            if [[ "$publication_state" == "present" ]]; then
              echo "Skipping existing ${name}@${version}"
            else
              echo "Publishing ${name}@${version} with provenance"
              if ! npm publish "./${directory}" --tag "$DIST_TAG" --access public --provenance; then
                echo "::error title=npm publish authorization failed::If npm returned E404, verify that this package exists, the publisher owns it, and npm trusted publishing names NAKAK10/vrev and release-package.yml exactly. New package names require a one-time token-authenticated bootstrap publish; see docs/releasing.md."
                return 1
              fi
            fi
          }

          publish_if_missing .
          publish_if_missing packages/plugin-sdk
          for directory in dist/plugins/review dist/plugins/ai dist/plugins/firestore dist/plugins/annotation-workflow dist/plugins/page-map dist/plugins/github-issue; do
            publish_if_missing "$directory"
          done
