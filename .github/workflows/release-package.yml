name: Publish package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nakak10'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          expected_tag="v${package_version}"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version (expected $expected_tag)." >&2
            exit 1
          fi

          if [ "$lock_version" != "$package_version" ]; then
            echo "package-lock.json version $lock_version does not match package version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Select npm dist-tag
        id: dist-tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish --tag "${{ steps.dist-tag.outputs.value }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
