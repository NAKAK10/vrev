name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to recover or republish missing packages
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nakak10'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          expected_tag="v${package_version}"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version (expected $expected_tag)." >&2
            exit 1
          fi

          if [ "$lock_version" != "$package_version" ] || [ "$lock_root_version" != "$package_version" ]; then
            echo "package-lock.json versions ($lock_version, $lock_root_version) do not match package version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Select npm dist-tag
        id: dist-tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Publish package when its version is new
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Skipping existing ${name}@${version}"
          else
            npm publish --tag "${{ steps.dist-tag.outputs.value }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugin packages when their version is new
        run: |
          for directory in plugins/review plugins/github-issue plugins/custom-command plugins/annotation-workflow plugins/firebase-storage; do
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Skipping existing ${name}@${version}"
            else
              npm publish "./${directory}" --tag latest
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
